# Automatic corrections: gate -> failure code -> action, or a list of actions
# used in order by attempt (last one repeats). Numerical settings only.
# Codes without an entry are not auto-corrected (-> UNRECOVERABLE with that code).
gate0:
  NOT_CLOSED:        {action: refine_tessellation, factor: 1.5}
  ILLEGAL_TRIANGLES: {action: refine_tessellation, factor: 1.5}
  # FEATURE_TOO_SMALL: design issue -> no auto-correction (never change design parameters)

gate1:
  TOO_MANY_CELLS:                       # PLAN: lower farfield/wake refinement first
    - {action: add,   param: mesh.wake_level,      by: -1}
    - {action: add,   param: mesh.near_body_level, by: -1}
    - {action: scale, param: mesh.base_cell_size,  by: 1.25}
  TOO_FEW_CELLS:
    - {action: add,   param: mesh.near_body_level, by: 1}
    - {action: add,   param: mesh.wake_level,      by: 1}
    - {action: scale, param: mesh.base_cell_size,  by: 0.8}
  AREA_RATIO_LOW:                       # PLAN: raise surface or feature refinement
    - {action: add, param: mesh.feature_level,       by: 1}
    - {action: add, param: mesh.n_feature_snap_iter, by: 10}
    - {action: add, param: mesh.surface_level,       by: 1}
  NON_ORTH_HIGH: &quality               # PLAN: snap tolerance / smoothing / nCellsBetweenLevels
    - {action: add, param: mesh.n_smooth_patch,         by: 2}
    - {action: add, param: mesh.n_cells_between_levels, by: 1}
    - {action: add, param: mesh.n_relax_iter,           by: 5}
  # P6-3 (Phase 7 experiment, notebooks/validation.ipynb): sHM's default
  # maxBoundarySkewness 20 let snapped boundary faces through that checkMesh
  # rejects (> 4). Limit 4 fixed 9/9 harsh failures, limit 3 9/9 with margin;
  # n_cells_between_levels / n_relax_iter changed nothing (0/9) and were dropped.
  # Studies now start at max_boundary_skewness 4 (study config).
  SKEWNESS_HIGH:
    - {action: set, param: mesh.max_boundary_skewness, value: 3.0}
    - {action: add, param: mesh.n_smooth_patch,        by: 2}
  NEGATIVE_VOLUMES: *quality
  # SHM_FAILED, CHECKMESH_FAILED, OPEN_BOUNDARY: no auto-correction

gate2:
  SOLVER_CRASHED: &diverge              # PLAN: relaxation, first-order start-up, non-orth correctors
    - {action: scale, param: solver.relax_U,               by: 0.7}
    - {action: set,   param: solver.upwind_startup_iters,  value: 100}
    - {action: add,   param: solver.n_non_orth_correctors, by: 1}
  NAN_DETECTED: *diverge
  FORCES_UNBOUNDED: *diverge
  RESIDUAL_DROP_LOW: &slow
    - {action: add, param: solver.pilot_iterations,      by: 200}
    - {action: add, param: solver.n_non_orth_correctors, by: 1}
    - {action: add, param: solver.pilot_iterations,      by: 200}
  CL_NOT_SETTLED: *slow
  POTENTIAL_INIT_FAILED:
    - {action: set, param: solver.potential_init, value: false}
  # CASE_SETUP_ERROR (bad/missing BC etc.): never auto-fixed (physics -> human)
  # MISSING_OUTPUT, UNDECIDED_THRESHOLD: no auto-correction

prod:                                   # restart from the latest written time
  SOLVER_CRASHED: &prod_diverge
    - {action: scale, param: solver.relax_U,               by: 0.7}
    - {action: add,   param: solver.n_non_orth_correctors, by: 1}
    - {action: scale, param: solver.relax_p,               by: 0.67}
  NAN_DETECTED: *prod_diverge
  # CASE_SETUP_ERROR, MISSING_OUTPUT: no auto-correction
