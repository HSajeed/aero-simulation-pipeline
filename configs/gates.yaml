# Gate thresholds. null = NOT DECIDED: gate code must treat an undecided check
# as not passable (fail / flag), never as a pass.
max_correction_attempts: 3      # CLAUDE.md rule 3 (validated <= 3)

gate0:                          # geometry / STL ("warn" = recorded, never blocks)
  require_closed: true
  max_illegal_triangles: 0      # confirmed 2026-11-23
  max_self_intersections: warn  # confirmed 2026-11-23: revisit after Phase 2 data
  min_triangle_quality: warn    # confirmed 2026-11-23
  min_tip_chord_cells: 12       # confirmed 2026-11-23: tip chord / finest surface cell size

gate1:                          # mesh (PLAN.md Phase 3)
  max_non_orth: 70
  max_skewness: 4
  max_negative_volumes: 0
  require_closed_boundary: true
  min_cells: 50000              # confirmed 2026-11-23: sanity floor; resolution set by Phase 7 GCI
  max_cells: 1000000            # confirmed
  min_wetted_area_ratio: 0.98

gate2:                          # pilot (PLAN.md Phase 4)
  min_residual_drop_orders: 2
  max_cl_change: 0.05           # relative, over the window
  cl_change_window: 100
  cl_change_floor: 0.05         # confirmed 2026-11-23: |CL| floor for the relative change
  max_abs_coeff: 2.0            # confirmed 2026-11-23: "forces bounded" limit on |Cl|,|Cd|,|Cm|

gate3:                          # plausibility (PLAN.md Phase 5)
  max_cl_rel_diff_vspaero: 0.25
  cl_vspaero_floor: 0.05        # confirmed 2026-11-23: |CL_VSPAERO| floor (alpha 0: CL ~ 0)
  max_mass_imbalance: 1.0e-3    # fraction of inflow
  coeff_std_window: 200         # confirmed 2026-11-23 (iterations)
  max_coeff_std: 1.0e-3         # confirmed: absolute std of CL over the window
  cl_alpha_slope_range: [3.0, 6.0]  # confirmed (per rad); Helmbold 3.85-5.25 over design space
  min_cd: 0.0                   # confirmed: negative CD is flagged
  # Cm / dCm/dalpha: warn only, never flags (human decision 2026-11-23)
