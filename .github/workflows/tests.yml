# Unit tests only (parsers, gates, corrections, DB, reports). No CFD and no OpenVSP in CI:
# the tests that need OpenVSP skip themselves; OpenFOAM is never called.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pytest -q
